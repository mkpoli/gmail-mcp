<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Gmail MCP feature comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12263f"/>
      <stop offset="1" stop-color="#0e3033"/>
    </linearGradient>
    <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6821F" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F6821F" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      text { fill: #ffffff; }
      .ja { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
      .en { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 13.5px; fill-opacity: 0.55; }
      .head { font-size: 19px; font-weight: 700; }
      .head-sm { font-size: 15.5px; font-weight: 700; }
      .headsub { font-size: 11.5px; fill-opacity: 0.55; }
      .row { font-size: 19px; font-weight: 600; }
      .rowsub { font-size: 11.5px; fill-opacity: 0.5; }
      .mark { font-size: 24px; font-weight: 700; }
      .word { font-size: 15px; font-weight: 600; }
      .note { font-size: 11px; fill-opacity: 0.62; }
      .foot { font-size: 12px; fill-opacity: 0.45; }
      .grid { stroke: #ffffff; stroke-opacity: 0.15; stroke-width: 1; }
      .yes { fill: #4ade80; }
      .no { fill: #f87171; }
      .part { fill: #fbbf24; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text class="ja title" x="52" y="52">Gmail MCPサーバー比較</text>
  <text class="en subtitle" x="52" y="75">同時に複数アカウント・送信・添付まで揃うものは意外と少ない</text>

  <rect x="356" y="96" width="196" height="516" rx="8" fill="url(#mine)" stroke="#F6821F" stroke-opacity="0.45" stroke-width="1.5"/>

  <text class="en head" x="454" y="130" text-anchor="middle">gmail-mcp</text>
  <text class="ja headsub" x="454" y="149" text-anchor="middle">本プロジェクト</text>

  <text class="ja head" x="640" y="130" text-anchor="middle">公式コネクタ</text>
  <text class="en headsub" x="640" y="149" text-anchor="middle">Claude · Google</text>

  <text class="en head-sm" x="828" y="130" text-anchor="middle">google_workspace_mcp</text>
  <text class="en headsub" x="828" y="149" text-anchor="middle">taylorwilsdon · 2.9k★</text>

  <text class="en head-sm" x="1016" y="130" text-anchor="middle">Gmail-MCP-Server</text>
  <text class="en headsub" x="1016" y="149" text-anchor="middle">ArtyMcLabin · 212★</text>

  <line class="grid" x1="52" y1="164" x2="1148" y2="164"/>
  <line class="grid" x1="356" y1="96" x2="356" y2="612"/>
  <line class="grid" x1="552" y1="96" x2="552" y2="612"/>
  <line class="grid" x1="734" y1="96" x2="734" y2="612"/>
  <line class="grid" x1="922" y1="96" x2="922" y2="612"/>

  <!-- 1 · where it runs -->
  <line class="grid" x1="52" y1="238" x2="1148" y2="238"/>
  <text class="ja row" x="52" y="196">動作環境</text>
  <text class="en rowsub" x="52" y="216">実行場所</text>
  <text class="ja word yes" x="454" y="200" text-anchor="middle">Workers</text>
  <text class="ja note" x="454" y="220" text-anchor="middle">サーバー不要</text>
  <text class="ja word" x="640" y="200" text-anchor="middle">事業者ホスト</text>
  <text class="ja note" x="640" y="220" text-anchor="middle">設置不要</text>
  <text class="ja word part" x="828" y="200" text-anchor="middle">自前サーバー</text>
  <text class="ja note" x="828" y="220" text-anchor="middle">常時稼働が必要</text>
  <text class="ja word part" x="1016" y="200" text-anchor="middle">ローカルのみ</text>
  <text class="ja note" x="1016" y="220" text-anchor="middle">stdio</text>

  <!-- 2 · multi account -->
  <line class="grid" x1="52" y1="312" x2="1148" y2="312"/>
  <text class="ja row" x="52" y="270">複数アカウント</text>
  <text class="en rowsub" x="52" y="290">同時接続</text>
  <text class="en mark yes" x="454" y="278" text-anchor="middle">✓</text>
  <text class="ja note" x="454" y="298" text-anchor="middle">接続ごとに固定</text>
  <text class="en mark no" x="640" y="284" text-anchor="middle">✕</text>
  <text class="en mark yes" x="828" y="278" text-anchor="middle">✓</text>
  <text class="ja note" x="828" y="298" text-anchor="middle">呼び出し時に指定</text>
  <text class="en mark no" x="1016" y="278" text-anchor="middle">✕</text>
  <text class="ja note" x="1016" y="298" text-anchor="middle">別名送信のみ</text>

  <!-- 3 · send -->
  <line class="grid" x1="52" y1="386" x2="1148" y2="386"/>
  <text class="ja row" x="52" y="344">メール送信</text>
  <text class="en rowsub" x="52" y="364">送信</text>
  <text class="en mark yes" x="454" y="358" text-anchor="middle">✓</text>
  <text class="en mark no" x="640" y="352" text-anchor="middle">✕</text>
  <text class="ja note" x="640" y="372" text-anchor="middle">下書きまで</text>
  <text class="en mark yes" x="828" y="358" text-anchor="middle">✓</text>
  <text class="en mark yes" x="1016" y="358" text-anchor="middle">✓</text>

  <!-- 4 · attachments -->
  <line class="grid" x1="52" y1="460" x2="1148" y2="460"/>
  <text class="ja row" x="52" y="418">添付・インライン画像</text>
  <text class="en rowsub" x="52" y="438">添付とcid:画像</text>
  <text class="en mark yes" x="454" y="432" text-anchor="middle">✓</text>
  <text class="ja word" x="640" y="430" text-anchor="middle">非公開</text>
  <text class="ja note" x="640" y="448" text-anchor="middle">仕様未記載</text>
  <text class="en mark yes" x="828" y="432" text-anchor="middle">✓</text>
  <text class="en mark yes" x="1016" y="432" text-anchor="middle">✓</text>

  <!-- 5 · reply all -->
  <line class="grid" x1="52" y1="534" x2="1148" y2="534"/>
  <text class="ja row" x="52" y="492">全員に返信＋引用</text>
  <text class="en rowsub" x="52" y="512">宛先を自動で決定</text>
  <text class="en mark yes" x="454" y="506" text-anchor="middle">✓</text>
  <text class="en mark no" x="640" y="506" text-anchor="middle">✕</text>
  <text class="en mark part" x="828" y="500" text-anchor="middle">△</text>
  <text class="ja note" x="828" y="520" text-anchor="middle">下書きのみ引用</text>
  <text class="en mark part" x="1016" y="500" text-anchor="middle">△</text>
  <text class="ja note" x="1016" y="520" text-anchor="middle">引用なし</text>

  <!-- 6 · token custody -->
  <line class="grid" x1="52" y1="608" x2="1148" y2="608"/>
  <text class="ja row" x="52" y="566">トークンの保持者</text>
  <text class="en rowsub" x="52" y="586">リフレッシュトークン</text>
  <text class="ja word yes" x="454" y="574" text-anchor="middle">自分</text>
  <text class="en note" x="454" y="592" text-anchor="middle">自分のWorker</text>
  <text class="ja word" x="640" y="574" text-anchor="middle">事業者</text>
  <text class="en note" x="640" y="592" text-anchor="middle">Google · Anthropic</text>
  <text class="ja word yes" x="828" y="574" text-anchor="middle">自分</text>
  <text class="en note" x="828" y="592" text-anchor="middle">自分のサーバー</text>
  <text class="ja word yes" x="1016" y="574" text-anchor="middle">自分</text>
  <text class="en note" x="1016" y="592" text-anchor="middle">自分のPC</text>

  <text class="en foot" x="52" y="646">github.com/mkpoli/gmail-mcp · MIT · 2026-07時点の各リポジトリ・公式ドキュメントに基づく</text>
</svg>
